name: Fair Feeder Morning Report

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Amsterdam'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date to process (YYYYMMDD)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.set-date.outputs.target_date }}
    steps:
      - name: Determine Target Date
        id: set-date
        run: |
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date_override }}"
          else
            TARGET_DATE=$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Europe/Amsterdam")).strftime("%Y%m%d"))')
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Determined Target Date: ${TARGET_DATE}"

  tapo-report:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: fair-feeder-${{ needs.prepare.outputs.target_date }}-TAPO
      cancel-in-progress: false

    steps:
      - name: Record scheduler heartbeat
        env:
          SCHEDULED_CRON: ${{ github.event.schedule }}
          CAMERA_NAME: TAPO
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          cron = os.environ.get("SCHEDULED_CRON", "")
          camera = os.environ.get("CAMERA_NAME", "")
          scheduled = ""
          delay = ""
          if cron:
              minute, hour, *_ = cron.split()
              scheduled_dt = now.replace(hour=int(hour), minute=int(minute), second=0, microsecond=0)
              scheduled = scheduled_dt.isoformat().replace("+00:00", "Z")
              delay = str(max(0, round((now - scheduled_dt).total_seconds() / 60)))

          print(f"GHA_JOB_STARTED_AT_UTC={now.isoformat().replace('+00:00', 'Z')}")
          print(f"GHA_SCHEDULE_CRON={cron}")
          print(f"GHA_SCHEDULED_AT_UTC={scheduled}")
          print(f"GHA_SCHEDULE_DELAY_MIN={delay}")
          print(f"CAMERA_NAME={camera}")
          PY

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install \
            ultralytics \
            easyocr \
            opencv-python-headless \
            papermill \
            ipykernel \
            google-auth \
            google-api-python-client \
            requests \
            nbformat \
            pytz \
            roboflow

      - name: Set Folder ID & Target Date
        run: |
          echo "GDRIVE_UPLOAD_FOLDER_ID=${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}" >> "$GITHUB_ENV"
          echo "GDRIVE_OUTPUT_FOLDER_ID=${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}" >> "$GITHUB_ENV"
          echo "TARGET_DATE=${{ needs.prepare.outputs.target_date }}" >> "$GITHUB_ENV"

      - name: Check TAPO Delivery Ledger Preflight
        id: preflight
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
        run: |
          if [ "${{ needs.prepare.outputs.target_date }}" == "REPLAY_TEST" ]; then
            echo "preflight_status=PROCEED" >> "$GITHUB_ENV"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          import json
          from scripts.delivery_ledger import load_delivery_ledger, is_camera_fully_delivered

          key_json = os.environ.get("GDRIVE_SERVICE_ACCOUNT_KEY")
          folder_id = os.environ.get("GDRIVE_OUTPUT_FOLDER_ID")
          target_date = os.environ.get("TARGET_DATE")
          drive_service = None
          if key_json:
              creds = service_account.Credentials.from_service_account_info(
                  json.loads(key_json), scopes=['https://www.googleapis.com/auth/drive']
              )
              drive_service = build('drive', 'v3', credentials=creds)

          ledger = load_delivery_ledger(drive_service, folder_id, target_date, "TAPO")
          if is_camera_fully_delivered(ledger):
              print("preflight_status=SKIP")
              print(f"✅ Preflight: TAPO report for {target_date} already fully delivered. Skipping analysis.")
          else:
              print("preflight_status=PROCEED")
          PY

      - name: Run analysis notebook
        if: env.preflight_status != 'SKIP' && needs.prepare.outputs.target_date != 'REPLAY_TEST'
        env:
          GITHUB_ACTIONS: 'true'
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
          GDRIVE_MODEL_FILE_ID: ${{ secrets.GDRIVE_MODEL_FILE_ID }}
          TelegramBotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TelegramChatId: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          ROBOFLOW_WORKSPACE: ${{ secrets.ROBOFLOW_WORKSPACE }}
          GITHUB_TOKEN: ${{ github.token }}
          CAMERA_NAME: TAPO
          TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
        run: |
          papermill morning_report.ipynb /tmp/smoketest_output.ipynb \
            -p CAMERA_NAME "TAPO" \
            -p DATE_OVERRIDE "${{ needs.prepare.outputs.target_date }}" \
            --log-output \
            --kernel python3

      - name: Deliver TAPO Replay Video to Telegram (REPLAY_TEST)
        if: needs.prepare.outputs.target_date == 'REPLAY_TEST'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
        run: |
          python scripts/send_tapo_replay_test.py

      - name: Upload TAPO timeline artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: tapo-timeline-${{ needs.prepare.outputs.target_date }}
          path: /tmp/output/tapo_timeline_${{ needs.prepare.outputs.target_date }}.json
          retention-days: 3

      - name: Upload output notebook (only when analysis fails)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: smoketest-output-TAPO-${{ github.run_id }}
          path: /tmp/smoketest_output.ipynb
          retention-days: 3

      - name: Report scheduler heartbeat
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from datetime import datetime, timezone

          def parse_z(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          started = parse_z(os.environ.get("GHA_JOB_STARTED_AT_UTC", ""))
          now = datetime.now(timezone.utc)
          runtime = round((now - started).total_seconds() / 60) if started else "unknown"

          print("## Scheduler heartbeat")
          print(f"- Camera: `TAPO`")
          print(f"- Cron: `{os.environ.get('GHA_SCHEDULE_CRON') or 'manual'}`")
          print(f"- Scheduled UTC: `{os.environ.get('GHA_SCHEDULED_AT_UTC') or 'manual'}`")
          print(f"- Job started UTC: `{os.environ.get('GHA_JOB_STARTED_AT_UTC') or 'unknown'}`")
          print(f"- Scheduler delay: `{os.environ.get('GHA_SCHEDULE_DELAY_MIN') or 'n/a'} min`")
          print(f"- Job runtime so far: `{runtime} min`")
          PY

  logitech-report:
    needs: [prepare, tapo-report]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: fair-feeder-${{ needs.prepare.outputs.target_date }}-LOGITECH
      cancel-in-progress: false

    steps:
      - name: Record scheduler heartbeat
        env:
          SCHEDULED_CRON: ${{ github.event.schedule }}
          CAMERA_NAME: LOGITECH
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          cron = os.environ.get("SCHEDULED_CRON", "")
          camera = os.environ.get("CAMERA_NAME", "")
          scheduled = ""
          delay = ""
          if cron:
              minute, hour, *_ = cron.split()
              scheduled_dt = now.replace(hour=int(hour), minute=int(minute), second=0, microsecond=0)
              scheduled = scheduled_dt.isoformat().replace("+00:00", "Z")
              delay = str(max(0, round((now - scheduled_dt).total_seconds() / 60)))

          print(f"GHA_JOB_STARTED_AT_UTC={now.isoformat().replace('+00:00', 'Z')}")
          print(f"GHA_SCHEDULE_CRON={cron}")
          print(f"GHA_SCHEDULED_AT_UTC={scheduled}")
          print(f"GHA_SCHEDULE_DELAY_MIN={delay}")
          print(f"CAMERA_NAME={camera}")
          PY

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install \
            ultralytics \
            easyocr \
            opencv-python-headless \
            papermill \
            ipykernel \
            google-auth \
            google-api-python-client \
            requests \
            nbformat \
            pytz \
            roboflow

      - name: Set Folder ID & Target Date
        run: |
          echo "GDRIVE_UPLOAD_FOLDER_ID=${{ secrets.GDRIVE_LOGITECH_FOLDER_ID }}" >> "$GITHUB_ENV"
          echo "GDRIVE_OUTPUT_FOLDER_ID=${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}" >> "$GITHUB_ENV"
          echo "TARGET_DATE=${{ needs.prepare.outputs.target_date }}" >> "$GITHUB_ENV"

      - name: Download TAPO timeline artifact
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: tapo-timeline-${{ needs.prepare.outputs.target_date }}
          path: /tmp/tapo_timeline_artifact

      - name: Run Logitech Gemini VLM Shadow Report
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_LOGITECH_FOLDER_ID: ${{ secrets.GDRIVE_LOGITECH_FOLDER_ID }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          ROBOFLOW_WORKSPACE: ${{ secrets.ROBOFLOW_WORKSPACE }}
        run: |
          REF_DIR="$RUNNER_TEMP/fair-feeder-reference"
          python scripts/prepare_vlm_references.py --out-dir "$REF_DIR"
          
          TIMELINE_ARG=""
          if [ -f "/tmp/tapo_timeline_artifact/tapo_timeline_${TARGET_DATE}.json" ]; then
            TIMELINE_ARG="--tapo-timeline /tmp/tapo_timeline_artifact/tapo_timeline_${TARGET_DATE}.json"
          elif [ -f "/tmp/output/tapo_timeline_${TARGET_DATE}.json" ]; then
            TIMELINE_ARG="--tapo-timeline /tmp/output/tapo_timeline_${TARGET_DATE}.json"
          fi

          if [ "${{ needs.prepare.outputs.target_date }}" == "REPLAY_TEST" ]; then
            CUSTOM_HDR=$'[SHADOW][TEST] Logitech recorder recovery replay\nREPLAY ACCEPTANCE\nSource footage: 2026-08-17'
            python scripts/logitech_vlm_shadow.py \
              --date 20260817 \
              --out-dir "/tmp/logitech_vlm_shadow_20260817" \
              --run-vlm \
              --confirm-cost \
              --vlm-provider gemini \
              --vlm-model gemini-2.5-flash \
              --send-telegram-shadow \
              --reference-dir "$REF_DIR" \
              --custom-header "$CUSTOM_HDR" \
              --cleanup-downloaded-videos
          else
            python scripts/logitech_vlm_shadow.py \
              --date "$TARGET_DATE" \
              --out-dir "/tmp/logitech_vlm_shadow_${TARGET_DATE}" \
              --run-vlm \
              --confirm-cost \
              --vlm-provider gemini \
              --vlm-model gemini-2.5-flash \
              --send-telegram-shadow \
              --reference-dir "$REF_DIR" \
              --cleanup-downloaded-videos \
              $TIMELINE_ARG
          fi
            
          # Clean up ephemeral references immediately
          rm -rf "$REF_DIR"

      - name: Upload output notebook (only when analysis fails)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: smoketest-output-LOGITECH-${{ github.run_id }}
          path: /tmp/smoketest_output.ipynb
          retention-days: 3

      - name: Report scheduler heartbeat
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from datetime import datetime, timezone

          def parse_z(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          started = parse_z(os.environ.get("GHA_JOB_STARTED_AT_UTC", ""))
          now = datetime.now(timezone.utc)
          runtime = round((now - started).total_seconds() / 60) if started else "unknown"

          print("## Scheduler heartbeat")
          print(f"- Camera: `LOGITECH`")
          print(f"- Cron: `{os.environ.get('GHA_SCHEDULE_CRON') or 'manual'}`")
          print(f"- Scheduled UTC: `{os.environ.get('GHA_SCHEDULED_AT_UTC') or 'manual'}`")
          print(f"- Job started UTC: `{os.environ.get('GHA_JOB_STARTED_AT_UTC') or 'unknown'}`")
          print(f"- Scheduler delay: `{os.environ.get('GHA_SCHEDULE_DELAY_MIN') or 'n/a'} min`")
          print(f"- Job runtime so far: `{runtime} min`")
          PY
