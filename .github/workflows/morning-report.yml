name: Fair Feeder Morning Report

on:
  schedule:
    - cron: '23 0 * * *'    # UTC; intentionally early so the runner can wait until the Amsterdam breakfast window closes.
  workflow_dispatch:         # Manual trigger for testing / historical validation.
    inputs:
      date_override:
        description: 'Date to process (YYYYMMDD)'
        required: false
        default: ''

jobs:
  prepare-window:
    name: Prepare target date and wait for feeding window
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      target_date: ${{ steps.resolve-target.outputs.target_date }}
      gha_job_started_at_utc: ${{ steps.resolve-target.outputs.gha_job_started_at_utc }}
      gha_schedule_cron: ${{ steps.resolve-target.outputs.gha_schedule_cron }}
      gha_scheduled_at_utc: ${{ steps.resolve-target.outputs.gha_scheduled_at_utc }}
      gha_schedule_delay_min: ${{ steps.resolve-target.outputs.gha_schedule_delay_min }}
      amsterdam_local_time: ${{ steps.resolve-target.outputs.amsterdam_local_time }}
    steps:
      - name: Resolve target date and emit diagnostic
        id: resolve-target
        shell: bash
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # Capture authoritative scheduler heartbeat at job START (pre-wait)
          GHA_JOB_STARTED_AT_UTC="$(python3 - <<'PY'
from datetime import datetime, timezone
print(datetime.now(timezone.utc).isoformat().replace('+00:00','Z'))
PY
)"
          GHA_SCHEDULE_CRON="${SCHEDULE_CRON:-}"
          if [ -n "$GHA_SCHEDULE_CRON" ]; then
            minute="$(echo $GHA_SCHEDULE_CRON | awk '{print $1}')"
            hour="$(echo $GHA_SCHEDULE_CRON | awk '{print $2}')"
            # compute scheduled_dt iso in UTC for diagnostic only
            GHA_SCHEDULED_AT_UTC="$(python3 - <<'PY'
from datetime import datetime, timezone
from zoneinfo import ZoneInfo
import os
cron = os.getenv('GHA_SCHEDULE_CRON','')
if cron:
    minute, hour, *_ = cron.split()
    now = datetime.now(timezone.utc)
    scheduled = now.replace(hour=int(hour), minute=int(minute), second=0, microsecond=0)
    print(scheduled.isoformat().replace('+00:00','Z'))
else:
    print('')
PY
)"
            # compute delay in minutes
            GHA_SCHEDULE_DELAY_MIN="$(python3 - <<'PY'
from datetime import datetime,timezone
from zoneinfo import ZoneInfo
import os
cron = os.getenv('GHA_SCHEDULE_CRON','')
if cron:
    minute, hour, *_ = cron.split()
    now = datetime.now(timezone.utc)
    scheduled = now.replace(hour=int(hour), minute=int(minute), second=0, microsecond=0)
    delay = max(0, round((now - scheduled).total_seconds() / 60))
    print(delay)
else:
    print('')
PY
)"
          else
            GHA_SCHEDULED_AT_UTC=""
            GHA_SCHEDULE_DELAY_MIN=""
          fi

          if [ -n "$DATE_OVERRIDE" ]; then
            TRIGGER="workflow_dispatch"
            TARGET_DATE="$DATE_OVERRIDE"
          else
            TRIGGER="schedule"
            TARGET_DATE="$(python3 - <<'PY'
from datetime import datetime
from zoneinfo import ZoneInfo
print(datetime.now(ZoneInfo("Europe/Amsterdam")).strftime("%Y%m%d"))
PY
)"
          fi

          AMSTERDAM_TIME="$(python3 - <<'PY'
from datetime import datetime
from zoneinfo import ZoneInfo
print(datetime.now(ZoneInfo("Europe/Amsterdam")).strftime("%Y-%m-%d %H:%M:%S %Z"))
PY
)"

          echo "TRIGGER: ${TRIGGER}"
          echo "RESOLVED TARGET DATE: ${TARGET_DATE}"
          echo "AMSTERDAM LOCAL TIME: ${AMSTERDAM_TIME}"

          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "gha_job_started_at_utc=${GHA_JOB_STARTED_AT_UTC}" >> "$GITHUB_OUTPUT"
          echo "gha_schedule_cron=${GHA_SCHEDULE_CRON}" >> "$GITHUB_OUTPUT"
          echo "gha_scheduled_at_utc=${GHA_SCHEDULED_AT_UTC}" >> "$GITHUB_OUTPUT"
          echo "gha_schedule_delay_min=${GHA_SCHEDULE_DELAY_MIN}" >> "$GITHUB_OUTPUT"
          echo "amsterdam_local_time=${AMSTERDAM_TIME}" >> "$GITHUB_OUTPUT"

          # expose env for internal step summaries
          echo "TRIGGER=${TRIGGER}" >> "$GITHUB_ENV"
          echo "TARGET_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          echo "AMSTERDAM_LOCAL_TIME=${AMSTERDAM_TIME}" >> "$GITHUB_ENV"
          echo "GHA_JOB_STARTED_AT_UTC=${GHA_JOB_STARTED_AT_UTC}" >> "$GITHUB_ENV"
          echo "GHA_SCHEDULE_CRON=${GHA_SCHEDULE_CRON}" >> "$GITHUB_ENV"
          echo "GHA_SCHEDULED_AT_UTC=${GHA_SCHEDULED_AT_UTC}" >> "$GITHUB_ENV"
          echo "GHA_SCHEDULE_DELAY_MIN=${GHA_SCHEDULE_DELAY_MIN}" >> "$GITHUB_ENV"

      - name: Wait until feeding window is complete
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.date_override == ''
        shell: bash
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: |
          set -euo pipefail
          if [ -n "$DATE_OVERRIDE" ]; then
            echo "Historical date override detected; skipping breakfast wait."
            exit 0
          fi

          python3 - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import time as sleep_time

          tz = ZoneInfo("Europe/Amsterdam")
          now = datetime.now(tz)
          target = datetime.combine(now.date(), time(6, 35), tzinfo=tz)
          wait_sec = max(0, int((target - now).total_seconds()))

          if wait_sec:
              print(f"Scheduler started early ({now:%H:%M:%S}); waiting {wait_sec//60}m {wait_sec%60}s until {target:%H:%M:%S} Amsterdam.")
              sleep_time.sleep(wait_sec)
          else:
              print(f"Scheduler started after feeding window close ({now:%H:%M:%S} Amsterdam); no wait needed.")
          PY

      - name: Report prepare job summary
        if: always()
        shell: bash
        run: |
          echo "## Prepare job summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- TRIGGER: ${TRIGGER:-${{ github.event_name }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "- RESOLVED TARGET DATE: ${TARGET_DATE:-${{ steps.resolve-target.outputs.target_date }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "- AMSTERDAM LOCAL TIME: ${AMSTERDAM_LOCAL_TIME:-$(python3 - <<'PY'
from datetime import datetime
from zoneinfo import ZoneInfo
print(datetime.now(ZoneInfo('Europe/Amsterdam')).strftime('%Y-%m-%d %H:%M:%S %Z'))
PY
)}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHA_JOB_STARTED_AT_UTC: ${GHA_JOB_STARTED_AT_UTC:-${{ steps.resolve-target.outputs.gha_job_started_at_utc }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHA_SCHEDULE_CRON: ${GHA_SCHEDULE_CRON:-${{ steps.resolve-target.outputs.gha_schedule_cron }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHA_SCHEDULED_AT_UTC: ${GHA_SCHEDULED_AT_UTC:-${{ steps.resolve-target.outputs.gha_scheduled_at_utc }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHA_SCHEDULE_DELAY_MIN: ${GHA_SCHEDULE_DELAY_MIN:-${{ steps.resolve-target.outputs.gha_schedule_delay_min }}}" >> "$GITHUB_STEP_SUMMARY"

  morning-report:
    name: morning-report (${{ matrix.camera }})
    needs: prepare-window
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: morning-report-${{ matrix.camera }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        camera: [TAPO, LOGITECH]
    env:
      TARGET_DATE: ${{ needs.prepare-window.outputs.target_date }}
      DATE_OVERRIDE: ${{ github.event.inputs.date_override || needs.prepare-window.outputs.target_date }}
      TRIGGER: ${{ github.event_name }}
      GHA_JOB_STARTED_AT_UTC: ${{ needs.prepare-window.outputs.gha_job_started_at_utc }}
      GHA_SCHEDULE_CRON: ${{ needs.prepare-window.outputs.gha_schedule_cron }}
      GHA_SCHEDULED_AT_UTC: ${{ needs.prepare-window.outputs.gha_scheduled_at_utc }}
      GHA_SCHEDULE_DELAY_MIN: ${{ needs.prepare-window.outputs.gha_schedule_delay_min }}
      AMSTERDAM_LOCAL_TIME: ${{ needs.prepare-window.outputs.amsterdam_local_time }}

    steps:
      - name: Record scheduler heartbeat (use pre-wait values)
        run: |
          echo "GHA_JOB_STARTED_AT_UTC=${GHA_JOB_STARTED_AT_UTC}" >> "$GITHUB_ENV"
          echo "GHA_SCHEDULE_CRON=${GHA_SCHEDULE_CRON}" >> "$GITHUB_ENV"
          echo "GHA_SCHEDULED_AT_UTC=${GHA_SCHEDULED_AT_UTC}" >> "$GITHUB_ENV"
          echo "GHA_SCHEDULE_DELAY_MIN=${GHA_SCHEDULE_DELAY_MIN}" >> "$GITHUB_ENV"
          echo "AMSTERDAM_LOCAL_TIME=${AMSTERDAM_LOCAL_TIME}" >> "$GITHUB_ENV"
          echo "CAMERA_NAME=${{ matrix.camera }}" >> "$GITHUB_ENV"

      - name: Show resolved target date
        run: |
          echo "TRIGGER: ${TRIGGER}"
          echo "RESOLVED TARGET DATE: ${TARGET_DATE}"
          echo "DATE_OVERRIDE: ${DATE_OVERRIDE}"

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        timeout-minutes: 20
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pip install \
            ultralytics \
            easyocr \
            opencv-python-headless \
            papermill \
            ipykernel \
            google-auth \
            google-api-python-client \
            requests \
            nbformat \
            pytz \
            roboflow

      - name: Set Folder ID
        run: |
          if [ "${{ matrix.camera }}" == "TAPO" ]; then
            echo "GDRIVE_UPLOAD_FOLDER_ID=${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}" >> "$GITHUB_ENV"
          else
            echo "GDRIVE_UPLOAD_FOLDER_ID=${{ secrets.GDRIVE_LOGITECH_FOLDER_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Determine Target Date
        run: |
          echo "TARGET_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"

      - name: Run analysis notebook
        if: matrix.camera == 'TAPO' && github.event.inputs.date_override != 'REPLAY_TEST'
        env:
          GITHUB_ACTIONS: 'true'
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
          GDRIVE_MODEL_FILE_ID: ${{ secrets.GDRIVE_MODEL_FILE_ID }}
          TelegramBotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TelegramChatId: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          ROBOFLOW_WORKSPACE: ${{ secrets.ROBOFLOW_WORKSPACE }}
          GITHUB_TOKEN: ${{ github.token }}
          CAMERA_NAME: ${{ matrix.camera }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override || needs.prepare-window.outputs.target_date }}
        run: |
          papermill morning_report.ipynb /tmp/smoketest_output.ipynb \
            -p CAMERA_NAME "$CAMERA_NAME" \
            -p DATE_OVERRIDE "${DATE_OVERRIDE}" \
            --log-output \
            --kernel python3

      - name: Deliver TAPO Replay Video to Telegram (REPLAY_TEST)
        if: github.event.inputs.date_override == 'REPLAY_TEST' && matrix.camera == 'TAPO'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
        run: |
          python scripts/send_tapo_replay_test.py

      - name: Run Logitech Gemini VLM Shadow Report
        if: matrix.camera == 'LOGITECH'
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_LOGITECH_FOLDER_ID: ${{ secrets.GDRIVE_LOGITECH_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          ROBOFLOW_WORKSPACE: ${{ secrets.ROBOFLOW_WORKSPACE }}
          TARGET_DATE: ${{ needs.prepare-window.outputs.target_date }}
        run: |
          REF_DIR="$RUNNER_TEMP/fair-feeder-reference"
          python scripts/prepare_vlm_references.py --out-dir "$REF_DIR"

          if [ "${{ github.event.inputs.date_override }}" == "REPLAY_TEST" ]; then
            CUSTOM_HDR=$'[SHADOW][TEST] Logitech recorder recovery replay\nREPLAY ACCEPTANCE\nSource footage: 2026-08-17'
            python scripts/logitech_vlm_shadow.py \
              --date 20260817 \
              --out-dir "/tmp/logitech_vlm_shadow_20260817" \
              --run-vlm \
              --confirm-cost \
              --vlm-provider gemini \
              --vlm-model gemini-2.5-flash \
              --send-telegram-shadow \
              --reference-dir "$REF_DIR" \
              --custom-header "$CUSTOM_HDR" \
              --cleanup-downloaded-videos
          else
            python scripts/logitech_vlm_shadow.py \
              --date "$TARGET_DATE" \
              --out-dir "/tmp/logitech_vlm_shadow_${TARGET_DATE}" \
              --run-vlm \
              --confirm-cost \
              --vlm-provider gemini \
              --vlm-model gemini-2.5-flash \
              --send-telegram-shadow \
              --reference-dir "$REF_DIR" \
              --cleanup-downloaded-videos
          fi

          rm -rf "$REF_DIR"

      - name: Upload output notebook (only when analysis fails)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: smoketest-output-${{ matrix.camera }}-${{ github.run_id }}
          path: /tmp/smoketest_output.ipynb
          retention-days: 3

      - name: Report scheduler heartbeat
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from datetime import datetime, timezone

          def parse_z(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          started = parse_z(os.environ.get("GHA_JOB_STARTED_AT_UTC", ""))
          now = datetime.now(timezone.utc)
          runtime = round((now - started).total_seconds() / 60) if started else "unknown"

          print("## Scheduler heartbeat")
          print(f"- Camera: `{os.environ.get('CAMERA_NAME')}`")
          print(f"- Cron: `{os.environ.get('GHA_SCHEDULE_CRON') or 'manual'}`")
          print(f"- Scheduled UTC: `{os.environ.get('GHA_SCHEDULED_AT_UTC') or 'manual'}`")
          print(f"- Job started UTC: `{os.environ.get('GHA_JOB_STARTED_AT_UTC') or 'unknown'}`")
          print(f"- Scheduler delay: `{os.environ.get('GHA_SCHEDULE_DELAY_MIN') or 'n/a'} min`")
          print(f"- Job runtime so far: `{runtime} min`")
          print(f"- Trigger: `{os.environ.get('TRIGGER') or '${{ github.event_name }}'}`")
          print(f"- Resolved target date: `{os.environ.get('TARGET_DATE') or 'unknown'}`")
          PY
